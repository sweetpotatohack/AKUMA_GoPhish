version: '3.8'

services:
  sneaky_gophish:
    image: sneaky_gophish:latest
    container_name: sneaky_gophish_ssl
    ports:
      - "3333:3333"  # Admin panel HTTPS
      - "443:443"    # Phish server HTTPS
    volumes:
      - ./ssl:/opt/gophish/ssl
      - ./config.json:/opt/gophish/config.json
    restart: unless-stopped
    environment:
      - GOPHISH_ADMIN_URL=https://admin.trendcommunity.org:3333
      - GOPHISH_PHISH_URL=https://trendcommunity.org

volumes:
  gophish_data:
